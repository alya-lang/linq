[package]
name = "linq"
version = "0.1.0"
alya-version = "0.0.20"
entry = "src/lib.alya"
description = "Fluent LINQ and functional collection query pipeline for Alya: filter, map, sort, group, aggregate and more"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/linq"
keywords = ["alya", "alya-lang", "package", "linq", "query", "stream", "filter", "map", "collections"]

[dependencies]

# Optional: feature-gated API slices. Members name another feature;
# gate the using code with `@cfg(feature = "...")` (see `src/lib.alya`
# and `src/pipeline.alya`). `default` is active unless the caller passes
# `--no-default-features`; select features explicitly via
# `alya build/run/test/bench/install --features <a,b>`.
[features]
default = ["filtering", "projection", "sorting_grouping", "aggregation", "generators"]
filtering = []
projection = []
sorting_grouping = []
aggregation = []
generators = []

